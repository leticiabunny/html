<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Portfólio de Atividades</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f0ff;
            color: #292344;
            text-align: center;
            padding: 40px 20px;
        }

        h1 { color: #7048c6; }

        .atividades {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            max-width: 900px;
            margin: 35px auto;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 12px #0001;
        }

        a {
            display: inline-block;
            background: #7048c6;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
        }

        a:hover { background: #52339b; }
    </style>
</head>
<body>
    <h1>Meu Portfólio</h1>
    <p>Confira as atividades que desenvolvi em HTML.</p>

    <div class="atividades">
        <div class="card">
            <h2>Atividade 1</h2>
            <p>Primeira atividade</p>
            <a href="index.html">Abrir atividade</a>
        </div>

        <div class="card">
            <h2>Atividade 2</h2>
            <p>Segunda atividade</p>
            <a href="index2.html">Abrir atividade</a>
        </div>

        <div class="card">
            <h2>Atividade 3</h2>
            <p>Terceira atividade</p>
            <a href="index3.html">Abrir atividade</a>
        </div>

        <div class="card">
            <h2>Atividade 4</h2>
            <p>Receita de bolo de cenoura</p>
            <a href="index4.html">Abrir atividade</a>
        </div>
    </div>
</body>
</html>
